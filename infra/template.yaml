AWSTemplateFormatVersion: "2010-09-09"
Description: Plant disease detector (requires the plant-disease-access stack for the role boundary) - storage, IAM, model registry, approval->deploy trigger, prediction API.

Parameters:
  Project:
    Type: String
    Default: plant-disease
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: CORS origin of the web page, e.g. https://<you>.github.io

Resources:
  # ---------- Storage ----------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Project}-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # SageMaker jobs always write with SSE-KMS (the aws/s3 key when no KmsKeyId is given),
      # so the bucket uses the same key for everything. The S3 Bucket Key cuts KMS requests,
      # which are billed per object, by ~99%.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: "aws:kms" }
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-spot-checkpoints
            Status: Enabled
            Prefix: checkpoints/
            ExpirationInDays: 7
          - Id: expire-pipeline-code-uploads
            Status: Enabled
            Prefix: !Sub "${Project}-train/"
            ExpirationInDays: 30
      Tags: [{ Key: project, Value: !Ref Project }]

  # ---------- SageMaker execution role (pipelines, jobs, endpoint) ----------
  SageMakerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-sagemaker"
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${Project}-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: sagemaker.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: sagemaker-project
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ArtifactBucket
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket, s3:GetBucketLocation]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
              - Sid: PullDeepLearningContainers
                Effect: Allow
                Action: [ecr:GetAuthorizationToken, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams, cloudwatch:PutMetricData]
                Resource: "*"
              - Sid: PipelineSteps
                Effect: Allow
                Action:
                  - sagemaker:CreateProcessingJob
                  - sagemaker:DescribeProcessingJob
                  - sagemaker:StopProcessingJob
                  - sagemaker:CreateTrainingJob
                  - sagemaker:DescribeTrainingJob
                  - sagemaker:StopTrainingJob
                  - sagemaker:CreateModelPackage
                  - sagemaker:DescribeModelPackage
                  - sagemaker:DescribeModelPackageGroup
                  - sagemaker:CreateModelPackageGroup  # the Register step calls it even when the group exists
                  - sagemaker:CreateModel
                  - sagemaker:DescribeModel
                  - sagemaker:CreateEndpointConfig
                  - sagemaker:DescribeEndpointConfig
                  - sagemaker:AddTags
                  - sagemaker:ListTags
                Resource: !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:*"
              # The endpoint itself is created/updated by DeployEndpointFunction (a pipeline LambdaStep).
              - Sid: InvokeDeployEndpointFunction
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${Project}-deploy-endpoint"
              - Sid: PassSelf
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-sagemaker"
                Condition:
                  StringEquals: { "iam:PassedToService": sagemaker.amazonaws.com }
      Tags: [{ Key: project, Value: !Ref Project }]

  ModelPackageGroup:
    Type: AWS::SageMaker::ModelPackageGroup
    Properties:
      ModelPackageGroupName: !Sub "${Project}-models"
      ModelPackageGroupDescription: PlantVillage leaf disease classifiers
      Tags: [{ Key: project, Value: !Ref Project }]

  # ---------- Approval in Model Registry -> start the deploy pipeline ----------
  DeployTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-deploy-trigger"
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${Project}-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-deploy-pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sagemaker:StartPipelineExecution
                Resource: !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:pipeline/${Project}-deploy"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt DeployTriggerLogs.Arn

  DeployTriggerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Project}-deploy-trigger"
      RetentionInDays: 14

  DeployTriggerFunction:
    Type: AWS::Lambda::Function
    DependsOn: DeployTriggerLogs
    Properties:
      FunctionName: !Sub "${Project}-deploy-trigger"
      Runtime: python3.13
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt DeployTriggerRole.Arn
      Environment:
        Variables:
          DEPLOY_PIPELINE: !Sub "${Project}-deploy"
      Code:
        ZipFile: |
          import os
          import boto3

          sm = boto3.client("sagemaker")


          def handler(event, context):
              arn = event["detail"]["ModelPackageArn"]
              print(f"Model package approved: {arn}")
              resp = sm.start_pipeline_execution(
                  PipelineName=os.environ["DEPLOY_PIPELINE"],
                  PipelineExecutionDisplayName=f"deploy-v{arn.rsplit('/', 1)[-1]}",
                  PipelineParameters=[{"Name": "ModelPackageArn", "Value": arn}],
              )
              print(f"Started {resp['PipelineExecutionArn']}")
      Tags: [{ Key: project, Value: !Ref Project }]

  ModelApprovedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${Project}-model-approved"
      Description: Start the deploy pipeline when a model package is approved.
      EventPattern:
        source: [aws.sagemaker]
        detail-type: [SageMaker Model Package State Change]
        detail:
          ModelPackageGroupName: [!Sub "${Project}-models"]
          ModelApprovalStatus: [Approved]
      Targets:
        - Id: deploy-trigger
          Arn: !GetAtt DeployTriggerFunction.Arn

  ModelApprovedPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DeployTriggerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ModelApprovedRule.Arn

  # ---------- Deploy pipeline step: create or update the serverless endpoint ----------
  # SageMaker Pipelines' Endpoint step always calls CreateEndpoint, which fails once the
  # endpoint exists. This function creates it the first time and updates it in place
  # afterwards (the old model keeps serving until the new one is healthy).
  DeployEndpointRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-deploy-endpoint"
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${Project}-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: manage-endpoint
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sagemaker:DescribeEndpoint, sagemaker:CreateEndpoint, sagemaker:UpdateEndpoint, sagemaker:AddTags]
                Resource:
                  - !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/${Project}-serverless"
                  - !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint-config/*"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt DeployEndpointLogs.Arn

  DeployEndpointLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Project}-deploy-endpoint"
      RetentionInDays: 14

  DeployEndpointFunction:
    Type: AWS::Lambda::Function
    DependsOn: DeployEndpointLogs
    Properties:
      FunctionName: !Sub "${Project}-deploy-endpoint"
      Runtime: python3.13
      Handler: index.handler
      Timeout: 600  # a Pipelines Lambda step waits at most 10 minutes
      Role: !GetAtt DeployEndpointRole.Arn
      Environment:
        Variables:
          PROJECT: !Ref Project
      Code:
        ZipFile: |
          import os
          import time

          import boto3

          sm = boto3.client("sagemaker")


          def describe(name):
              try:
                  return sm.describe_endpoint(EndpointName=name)
              except sm.exceptions.ClientError as e:
                  if "Could not find endpoint" in str(e):
                      return None
                  raise


          def handler(event, context):
              name, config = event["endpoint_name"], event["endpoint_config_name"]
              current = describe(name)
              old_reason = current.get("FailureReason") if current else None  # left over from an earlier failed update
              if current is None:
                  sm.create_endpoint(EndpointName=name, EndpointConfigName=config,
                                     Tags=[{"Key": "project", "Value": os.environ["PROJECT"]}])
                  action = "created"
              elif current["EndpointStatus"] == "InService":
                  sm.update_endpoint(EndpointName=name, EndpointConfigName=config)
                  action = "updated"
              else:
                  raise RuntimeError(f"Endpoint {name} is {current['EndpointStatus']}; cannot deploy now")
              print(f"{action} {name} -> {config}")
              status = "unknown"

              # Wait for the result so the pipeline step fails if the new model doesn't come up.
              while context.get_remaining_time_in_millis() > 20_000:
                  time.sleep(15)
                  ep = describe(name)
                  status = ep["EndpointStatus"]
                  if status == "InService" and ep["EndpointConfigName"] == config:
                      return {"action": action, "endpoint_status": status}
                  if status == "Failed" or (status == "InService" and ep.get("FailureReason") not in (None, old_reason)):
                      # A failed update rolls back to the previous config and sets FailureReason.
                      raise RuntimeError(f"Deploy failed: {ep.get('FailureReason')}")
              raise TimeoutError(f"Endpoint {name} still {status} after waiting")
      Tags: [{ Key: project, Value: !Ref Project }]

  # ---------- Public prediction API: HTTP API -> Lambda -> serverless endpoint ----------
  PredictRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-predict"
      PermissionsBoundary: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${Project}-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-endpoint
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sagemaker:InvokeEndpoint
                Resource: !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/${Project}-serverless"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt PredictLogs.Arn

  PredictLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Project}-predict"
      RetentionInDays: 14

  PredictFunction:
    Type: AWS::Lambda::Function
    DependsOn: PredictLogs
    Properties:
      FunctionName: !Sub "${Project}-predict"
      Runtime: python3.13
      Handler: index.handler
      Timeout: 29  # HTTP API integration limit is 30 s
      MemorySize: 256
      Role: !GetAtt PredictRole.Arn
      Environment:
        Variables:
          ENDPOINT_NAME: !Sub "${Project}-serverless"
      Code:
        ZipFile: |
          import base64
          import json
          import os

          import boto3
          from botocore.config import Config

          runtime = boto3.client("sagemaker-runtime", config=Config(read_timeout=27, retries={"max_attempts": 1}))
          MAX_BYTES = 3 * 1024 * 1024  # serverless payload limit is 4 MB


          def reply(status, body):
              return {"statusCode": status, "headers": {"Content-Type": "application/json"}, "body": json.dumps(body)}


          def handler(event, context):
              body = event.get("body") or ""
              data = base64.b64decode(body) if event.get("isBase64Encoded") else body.encode("latin-1")
              ctype = event.get("headers", {}).get("content-type", "image/jpeg").split(";")[0]
              if not data or ctype not in ("image/jpeg", "image/png"):
                  return reply(400, {"error": "POST a JPEG or PNG image as the raw request body"})
              if len(data) > MAX_BYTES:
                  return reply(413, {"error": "Image too large; resize to under 3 MB"})
              try:
                  resp = runtime.invoke_endpoint(EndpointName=os.environ["ENDPOINT_NAME"], ContentType=ctype, Body=data)
              except runtime.exceptions.ValidationError as e:
                  return reply(503, {"error": "Model endpoint not deployed yet", "detail": str(e)})
              except Exception as e:  # cold start timeouts, model errors
                  print(repr(e))
                  return reply(503, {"error": "Model is warming up, please retry in a few seconds"})
              return reply(200, json.loads(resp["Body"].read()))
      Tags: [{ Key: project, Value: !Ref Project }]

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${Project}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type]
      Tags: { project: !Ref Project }

  PredictIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PredictFunction.Arn
      PayloadFormatVersion: "2.0"

  PredictRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /predict
      Target: !Sub "integrations/${PredictIntegration}"

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PredictFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/predict"

Outputs:
  BucketName:
    Value: !Ref ArtifactBucket
  SageMakerRoleArn:
    Value: !GetAtt SageMakerRole.Arn
  DeployEndpointFunctionArn:
    Value: !GetAtt DeployEndpointFunction.Arn
  ModelPackageGroupName:
    Value: !Sub "${Project}-models"
  PredictUrl:
    Value: !Sub "${HttpApi.ApiEndpoint}/predict"
